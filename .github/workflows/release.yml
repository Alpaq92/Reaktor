name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ github.ref_name }}

  macos:
    uses: ./.github/workflows/macos.yml
    with:
      version: ${{ github.ref_name }}

  linux:
    uses: ./.github/workflows/linux.yml
    with:
      version: ${{ github.ref_name }}
      strict: true

  bsd:
    uses: ./.github/workflows/bsd.yml
    with:
      version: ${{ github.ref_name }}
      strict: true

  web:
    uses: ./.github/workflows/web.yml
    with:
      version: ${{ github.ref_name }}

  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          path: src

      - name: Archive
        run: |
          name="reaktor-${GITHUB_REF_NAME#v}-source"
          mkdir dist
          tar --exclude=.git --transform "s,^src,$name," -czf "dist/$name.tar.gz" src

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-source
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [windows, macos, linux, bsd, web, source]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          v=${GITHUB_REF_NAME#v}
          cat >notes.md <<EOF
          | System | Architectures | Download |
          | --- | --- | --- |
          | Windows | x64, x86, ARM64 | \`reaktor-$v-windows-<arch>.zip\` |
          | macOS | Apple silicon (arm64), Intel (x86_64) | \`reaktor-$v-macos-<arch>.zip\` |
          | Linux | x86-64, x86, ARM64, ARMv7 (armhf), RISC-V 64 | \`reaktor-$v-linux-<arch>.tar.gz\` |
          | FreeBSD 15.1 | x86-64, ARM64 | \`reaktor-$v-freebsd-<arch>.tar.gz\` |
          | OpenBSD 7.9 | x86-64, ARM64 | \`reaktor-$v-openbsd-<arch>.tar.gz\` |
          | NetBSD 11.0 | x86-64, ARM64 | \`reaktor-$v-netbsd-<arch>.tar.gz\` |
          | Web | WebAssembly | \`reaktor-$v-web.zip\` |
          | Source | every submodule included | \`reaktor-$v-source.tar.gz\` |

          Each native package holds the showcase, Notepad, Simple and the bench,
          the files they read at runtime, and every license (\`licenses/\`,
          \`NOTICE.md\`). Unpack it anywhere and run \`showcase\`; it finds its files
          beside itself.

          - **Windows**: the C runtime is linked in, so there is nothing to install.
            The programs are not signed, and SmartScreen may ask before the first run.
          - **macOS**: \`reaktor.app\` is the showcase as an app, signed ad hoc and not
            notarized: open it from its context menu the first time.
          - **Linux**: glibc 2.36 or newer (2.41 for RISC-V), libdbus-1, and X11 or
            Wayland.
          - **BSDs**: the release named above, the dbus package, and X11.
          - **Web**: the showcase, Notepad and Simple as \`.html\`, \`.js\`, \`.wasm\`
            and \`.data\`. Serve the folder over HTTP (a \`file://\` page cannot fetch
            the \`.wasm\`) and open \`showcase.html\`; the same showcase runs at
            https://alpaq92.github.io/Reaktor/.

          ### libreaktor

          The library itself, for building your own applications: the same
          systems and architectures, \`libreaktor-$v-<system>-<arch>\`, and
          \`libreaktor-$v-wasm.tar.gz\`. Each holds one static library (\`reaktor.lib\`
          on Windows, built against the DLL C runtime; \`libreaktor.a\` elsewhere)
          with SDL, libcss, plutosvg, Onlay, NukAnim, mojibake and kb_text_shape
          inside it, the public headers (\`#include "reaktor/reaktor.h"\`, with
          Nuklear's, NukAnim's and SDL's), a CMake package and a pkg-config file,
          and the licenses.

          \`\`\`cmake
          find_package(reaktor ${v%.*} REQUIRED)  # with CMAKE_PREFIX_PATH at the unpacked folder
          add_executable(app WIN32 main.c)
          target_link_libraries(app PRIVATE reaktor::reaktor)
          \`\`\`

          or \`cc main.c \$(pkg-config --cflags --libs reaktor)\` with
          \`PKG_CONFIG_PATH\` at its \`lib/pkgconfig\`.

          \`SHA256SUMS\` lists every download's checksum. GitHub's own source
          archives below leave the submodules out; the \`-source.tar.gz\` above has
          them.
          EOF
          (cd dist && sha256sum -- * >SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Reaktor $GITHUB_REF_NAME" --notes-file notes.md --generate-notes \
            --verify-tag
