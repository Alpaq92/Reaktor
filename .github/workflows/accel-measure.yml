name: accel-measure

on:
  push:
    branches: [accel-measure]

permissions:
  contents: read

jobs:
  measure:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build both
        run: |
          brew install ninja
          sw_vers; uname -m
          ./build.sh showcase </dev/null
          mkdir -p A B
          cp build/showcase A/showcase
          perl -0pi -e 's/(reaktor_hint\(SDL_HINT_RENDER_DRIVER, "software"\);\n)/$1        reaktor_hint(SDL_HINT_FRAMEBUFFER_ACCELERATION, "0");\n/' runtime/app.c
          git diff
          ./build.sh showcase </dev/null
          cp build/showcase B/showcase
          shasum A/showcase B/showcase

      - name: Which renderer
        run: |
          for a in A B; do
            echo "== $a"
            ./$a/showcase --tab 9 --a11y-dump $a-diag.txt > $a-log.txt 2>&1 || echo "exit $?"
            cat $a-log.txt | head -20
            grep -iE "backend|render|present|scale|software|metal" $a-diag.txt | head -30
            ./$a/showcase --tab 0 --shot $a-shot.bmp --a11y-dump $a-dump.txt >/dev/null 2>&1 || echo "shot exit $?"
          done
          shasum A-shot.bmp B-shot.bmp
          diff <(grep -v volatile A-dump.txt) <(grep -v volatile B-dump.txt) | head -20 || true

      - name: Idle, five each alternating
        run: |
          for i in 1 2 3 4 5; do
            if [ $((i % 2)) = 1 ]; then order="A B"; else order="B A"; fi
            for a in $order; do
              ./$a/showcase --tab 0 >/dev/null 2>&1 &
              pid=$!
              sleep 8
              rss=$(ps -o rss= -p $pid | tr -d ' ')
              cpu=$(ps -o %cpu= -p $pid | tr -d ' ')
              thr=$(ps -M -p $pid | tail -n +2 | wc -l | tr -d ' ')
              fp=$(vmmap --summary $pid 2>/dev/null | grep -E "^Physical footprint:" | head -1)
              fpk=$(vmmap --summary $pid 2>/dev/null | grep -E "^Physical footprint \(peak\):" | head -1)
              imgs=$(vmmap $pid 2>/dev/null | grep -oE '/System/Library/[A-Za-z/]*(Metal|OpenGL|IOSurface|AGX|GPU|QuartzCore|CoreDisplay)[A-Za-z0-9_.]*' | sed 's#.*/##' | sort -u | tr '\n' ' ')
              ios=$(vmmap $pid 2>/dev/null | grep -cE '^IOSurface|IOAccelerator')
              echo "RUN pair=$i arm=$a rss_kb=$rss cpu=$cpu threads=$thr $fp | $fpk | iosurface_ioaccel_regions=$ios"
              echo "IMGS arm=$a $imgs"
              if [ $i = 1 ]; then vmmap --summary $pid > $a-summary.txt 2>&1; fi
              kill $pid; wait $pid 2>/dev/null
              sleep 1
            done
          done
          for a in A B; do echo "== $a summary"; grep -E "IOSurface|IOAccelerator|MALLOC|Physical|TOTAL" $a-summary.txt | head -30; done
