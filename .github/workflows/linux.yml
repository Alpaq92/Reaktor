name: Linux

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
      strict:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    continue-on-error: ${{ matrix.emulated && !inputs.strict }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86-64, platform: linux/amd64, image: 'debian:bookworm', runner: ubuntu-24.04, emulated: false, timeout: 60 }
          - { arch: x86, platform: linux/386, image: 'debian:bookworm', runner: ubuntu-24.04, emulated: false, timeout: 60 }
          - { arch: arm64, platform: linux/arm64, image: 'debian:bookworm', runner: ubuntu-24.04-arm, emulated: false, timeout: 60 }
          - { arch: armhf, platform: linux/arm/v7, image: 'debian:bookworm', runner: ubuntu-24.04, emulated: true, timeout: 240 }
          - { arch: riscv64, platform: linux/riscv64, image: 'debian:trixie', runner: ubuntu-24.04, emulated: true, timeout: 240 }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up QEMU
        if: ${{ matrix.emulated }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: ${{ matrix.platform }}

      - name: Start Debian
        id: debian
        run: |
          docker run -d --name debian --platform ${{ matrix.platform }} \
            -v "$PWD:/src" -w /src ${{ matrix.image }} sleep infinity
          docker exec debian sh -c 'uname -m; cat /etc/debian_version'

      - name: Install packages
        run: |
          docker exec -i debian sh -eu <<'EOF'
          export DEBIAN_FRONTEND=noninteractive
          apt-get update </dev/null
          apt-get install -y --no-install-recommends \
            cmake ninja-build gcc g++ pkgconf file diffutils \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxrandr-dev libxrender-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libegl-dev libdbus-1-dev \
            dbus xvfb xauth </dev/null
          EOF

      - name: Build
        id: build
        run: |
          docker exec -i debian sh -eu <<'EOF'
          uname -a
          cc --version
          cmake --version
          ./build.sh </dev/null
          file build/showcase
          echo "needs $(objdump -T build/showcase | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          EOF

      - name: Console tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker exec -i debian sh -u <<'EOF'
          fail=0
          for t in onlaytest keytest a11ytest animtest localetest laytest texttest csstest; do
            echo "== $t"
            if ./build/$t </dev/null; then :; else echo "$t: exit status $?"; fail=1; fi
          done
          exit "$fail"
          EOF

      - name: Shots and dumps
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker exec -i debian sh -u <<'EOF'
          rm -rf smoke
          mkdir smoke
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp </dev/null >smoke/xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || :' EXIT
          n=0
          while [ ! -S /tmp/.X11-unix/X99 ]; do
            n=$((n + 1))
            if [ "$n" -gt 120 ] || ! kill -0 "$xvfb_pid" 2>/dev/null; then
              echo "Xvfb did not start"
              cat smoke/xvfb.log || :
              exit 1
            fi
            sleep 1
          done
          fail=0
          shot() {
            name=$1
            driver=$2
            shift 2
            if DISPLAY=:99 dbus-run-session -- \
                timeout 600 "$@" --video "$driver" \
                --shot "smoke/$name.bmp" --a11y-dump "smoke/$name.txt" \
                </dev/null >"smoke/$name.log" 2>&1; then
              if [ -s "smoke/$name.bmp" ] && [ -s "smoke/$name.txt" ]; then
                echo "$name: ok"
                return 0
              fi
              echo "$name: exited 0 without both a shot and a dump"
            else
              echo "$name: exit status $?"
            fi
            cat "smoke/$name.log" || :
            fail=1
          }
          shot simple x11 ./build/simple --theme light
          shot showcase x11 ./build/showcase --tab 7 --theme dark
          shot simple-dummy dummy ./build/simple --theme light
          exit "$fail"
          EOF

      - name: Package
        id: package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          version='${{ inputs.version || 'dev' }}'
          name="reaktor-${version#v}-linux-${{ matrix.arch }}"
          docker exec -i -e name="$name" debian sh -eu <<'EOF'
          sh tools/package.sh build "dist/$name"
          mkdir -p check
          for from in "built build" "packed dist/$name"; do
            set -- $from
            timeout 600 "$2/showcase" --tab 8 --theme light --video dummy \
              --shot "check/$1.bmp" --a11y-dump "check/$1.txt" </dev/null
          done
          for e in bmp txt; do
            cmp "check/built.$e" "check/packed.$e"
          done
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          EOF

      - name: Upload the package
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-linux-${{ matrix.arch }}
          path: dist/reaktor-*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Check and pack libreaktor
        id: libcheck
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          version='${{ inputs.version || 'dev' }}'
          name="libreaktor-${version#v}-linux-${{ matrix.arch }}"
          docker exec -i -e name="$name" debian sh -eu <<'EOF'
          cmake --build build --target libreaktor </dev/null
          cmake --install build --prefix "dist/$name" --component libreaktor </dev/null
          cmake -S examples/consumer -B build-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release \
                "-DCMAKE_PREFIX_PATH=$PWD/dist/$name" </dev/null
          cmake --build build-consumer </dev/null
          mkdir -p check
          for from in "lib-built build/simple" "lib-linked build-consumer/simple"; do
            set -- $from
            timeout 600 "$2" --theme light --video dummy \
              --shot "check/$1.bmp" --a11y-dump "check/$1.txt" </dev/null
          done
          for e in bmp txt; do
            cmp "check/lib-built.$e" "check/lib-linked.$e"
          done
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          EOF

      - name: Check an app that embeds Reaktor
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.arch == 'x86-64' }}
        run: |
          docker exec -i debian sh -eu <<'EOF'
          cmake -S examples/embedded -B build-embedded -G Ninja -DCMAKE_BUILD_TYPE=Release </dev/null
          cmake --build build-embedded --target simple </dev/null
          mkdir -p check
          for from in "tree build/simple" "embedded build-embedded/simple"; do
            set -- $from
            timeout 600 dbus-run-session -- "$2" --theme light --video dummy \
              --shot "check/$1.bmp" --a11y-dump "check/$1.txt" </dev/null
          done
          for e in bmp txt; do
            cmp "check/tree.$e" "check/embedded.$e"
          done
          EOF

      - name: Upload libreaktor
        if: ${{ !cancelled() && steps.libcheck.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-libreaktor-linux-${{ matrix.arch }}
          path: dist/libreaktor-*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Collect the build logs
        if: ${{ always() && steps.debian.outcome == 'success' }}
        run: |
          docker exec -i debian sh -u <<'EOF'
          mkdir -p smoke
          for f in build/CMakeCache.txt build/CMakeFiles/CMakeConfigureLog.yaml; do
            if [ -f "$f" ]; then cp "$f" smoke/; fi
          done
          EOF

      - name: Upload the shots
        if: ${{ always() && steps.debian.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch }}
          path: smoke/
          if-no-files-found: warn
          retention-days: 14
