name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  EMSCRIPTEN_VERSION: 6.0.9

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Cache emsdk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSCRIPTEN_VERSION }}-tag

      - name: Install emsdk
        run: |
          if [ ! -x "$HOME/emsdk/emsdk" ]; then
            git clone --depth 1 --branch "$EMSCRIPTEN_VERSION" https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          fi
          "$HOME/emsdk/emsdk" install "$EMSCRIPTEN_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSCRIPTEN_VERSION"

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build
        run: EMSDK="$HOME/emsdk" ./build-wasm.sh

      - name: Assemble the site
        run: |
          mkdir -p site
          cp build-wasm/showcase.js build-wasm/showcase.wasm build-wasm/showcase.data site/
          cp build-wasm/shell.js build-wasm/keylog.js build-wasm/reaktor-icon.svg build-wasm/reaktor-icon.png site/
          cp build-wasm/showcase.html site/index.html

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
