name: BSD

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
      strict:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bsd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The x86-64 machines run with hardware virtualization, and also
  # cross-compile the arm64 programs here, for the arm64 machines below to run.
  # OpenBSD's base compiler has no arm64 backend, so it uses the ports LLVM.
  bsd:
    name: ${{ matrix.os }} ${{ matrix.version }} ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: freebsd, version: '15.1', arch: x86-64, cross: true }
          - { os: openbsd, version: '7.9', arch: x86-64, cross: true }
          - { os: netbsd, version: '11.0', arch: x86-64, cross: true }
    defaults:
      run:
        shell: cpa.sh {0} --sync-files none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # The build folders keep CMake's checks, which ccache cannot: they link.
      - name: Restore the build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ccache
            build
            build-arm64
          key: build-${{ matrix.os }}-${{ matrix.version }}-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: build-${{ matrix.os }}-${{ matrix.version }}-${{ matrix.arch }}-

      # ninja rebuilds by mtime, and a checkout dates every file now. Date them
      # before the cached objects instead, and only what changed since the
      # commit that build came from after them. Commit times would not do: a
      # branch older than the cache would never rebuild its own changes.
      - name: Date the sources against the cached build
        shell: bash
        run: |
          old=$(cat build/.reaktor-cache-sha 2>/dev/null || true)
          git ls-files -z --recurse-submodules | xargs -0 touch -h -d 2000-01-01T00:00:00Z
          if [ -n "$old" ] &&
             { git cat-file -e "$old^{commit}" 2>/dev/null ||
               git fetch -q --depth=1 origin "$old" 2>/dev/null; }; then
            git diff --name-only -z "$old" HEAD | while IFS= read -r -d '' p; do
              if [ -d "$p" ]; then find "$p" -type f -exec touch {} +
              elif [ -e "$p" ]; then touch "$p"; fi
            done
            echo "cached build is from $old; $(git diff --name-only "$old" HEAD | wc -l) paths differ"
          else
            git ls-files -z --recurse-submodules | xargs -0 touch -h
            echo "no cached build to diff against; every source is new"
          fi

      - name: Start VM
        id: vm
        uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 # v1.6.0
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}
          architecture: ${{ matrix.arch }}
          shell: sh
          cpu_count: 4
          memory: 8G
          sync_files: runner-to-vm

      - name: Install packages
        run: |
          PATH=/usr/pkg/sbin:/usr/pkg/bin:/usr/local/sbin:/usr/local/bin:$PATH
          export PATH
          case "$(uname -s)" in
            FreeBSD)
              sudo env IGNORE_OSVERSION=yes pkg install -y \
                cmake-core ninja ccache pkgconf dbus xorg-vfbserver xorgproto \
                libX11 libXext libXcursor libXi libXfixes libXrandr libXrender libXtst \
                libxkbcommon wayland wayland-protocols libglvnd </dev/null
              ;;
            OpenBSD)
              sudo pkg_add -I cmake-core ninja ccache dbus libxkbcommon wayland wayland-protocols llvm%21 </dev/null
              ;;
            NetBSD)
              sudo -E pkgin -y update </dev/null
              sudo -E pkgin -y install cmake ninja-build ccache pkgconf dbus libxkbcommon wayland wayland-protocols \
                clang lld llvm </dev/null
              ;;
          esac

      - name: Build
        id: build
        run: |
          PATH=/usr/pkg/sbin:/usr/pkg/bin:/usr/local/sbin:/usr/local/bin:$PATH
          export PATH
          uname -a
          cc --version
          cmake --version
          CCACHE_DIR=$PWD/.ccache CCACHE_BASEDIR=$PWD CCACHE_MAXSIZE=2G
          export CCACHE_DIR CCACHE_BASEDIR CCACHE_MAXSIZE
          ccache -z
          # SDL compiles through a precompiled header, which ccache will not cache.
          ./build.sh -- -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                        -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON </dev/null
          ccache -s

      - name: Gather the arm64 sysroot
        if: ${{ matrix.cross }}
        run: |
          PATH=/usr/pkg/sbin:/usr/pkg/bin:/usr/local/sbin:/usr/local/bin:$PATH
          export PATH
          sh tools/cross/sysroot.sh ${{ matrix.os }} ${{ matrix.version }} "$HOME/sysroot-arm64" </dev/null

      - name: Cross-compile for arm64
        id: cross
        if: ${{ matrix.cross }}
        run: |
          PATH=/usr/pkg/sbin:/usr/pkg/bin:/usr/local/sbin:/usr/local/bin:$PATH
          export PATH
          sysroot=$HOME/sysroot-arm64
          case "$(uname -s)" in
            OpenBSD) ulimit -Sd "$(ulimit -Hd)" ;;
          esac
          CCACHE_DIR=$PWD/.ccache CCACHE_BASEDIR=$PWD CCACHE_MAXSIZE=2G
          export CCACHE_DIR CCACHE_BASEDIR CCACHE_MAXSIZE
          REAKTOR_TARGET_RELEASE=${{ matrix.version }}
          export REAKTOR_TARGET_RELEASE
          ccache -z
          cmake -S . -B build-arm64 -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE="$PWD/tools/cross/${{ matrix.os }}-aarch64.cmake" \
                -DREAKTOR_SYSROOT="$sysroot" \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON </dev/null
          cmake --build build-arm64 --parallel 4 </dev/null
          cmake --build build-arm64 --target mkicon libreaktor </dev/null
          ccache -s
          file build-arm64/showcase
          file build-arm64/showcase | grep -q aarch64
          if readelf -d build-arm64/showcase | grep -q "$sysroot"; then
            echo "the program carries the sysroot's path"; exit 1
          fi
          version='${{ inputs.version || 'dev' }}'
          name="libreaktor-${version#v}-${{ matrix.os }}-arm64"
          cmake --install build-arm64 --prefix "dist/$name" --component libreaktor </dev/null
          if grep -rq "$sysroot" "dist/$name/lib/cmake" "dist/$name/lib/pkgconfig"; then
            echo "the package carries the sysroot's path"; exit 1
          fi
          tar -cf cross-${{ matrix.os }}-arm64.tar \
            build-arm64/onlaytest build-arm64/keytest build-arm64/a11ytest build-arm64/animtest \
            build-arm64/localetest build-arm64/laytest build-arm64/texttest build-arm64/csstest \
            build-arm64/showcase build-arm64/notepad build-arm64/simple build-arm64/bench \
            build-arm64/licenses build-arm64/CMakeCache.txt "dist/$name"

      # Back to the runner now, so the next run finds this build in the cache
      # while this one is still testing.
      - name: Keep the build
        if: ${{ always() && steps.build.outcome == 'success' }}
        shell: cpa.sh {0} --sync-files vm-to-runner
        run: ':'

      - name: Note which commit the cached build is from
        if: ${{ always() && steps.build.outcome == 'success' }}
        shell: bash
        run: git rev-parse HEAD > build/.reaktor-cache-sha

      - name: Save the build cache
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ccache
            build
            build-arm64
          key: build-${{ matrix.os }}-${{ matrix.version }}-${{ matrix.arch }}-${{ github.run_id }}

      - name: Upload the arm64 build
        if: ${{ matrix.cross && steps.cross.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-${{ matrix.os }}-arm64
          path: cross-${{ matrix.os }}-arm64.tar
          if-no-files-found: error
          retention-days: 1

      - name: Console tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          fail=0
          for t in onlaytest keytest a11ytest animtest localetest laytest texttest csstest; do
            echo "== $t"
            if ./build/$t </dev/null; then :; else echo "$t: exit status $?"; fail=1; fi
          done
          exit "$fail"

      - name: Shots and dumps
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          PATH=/usr/pkg/sbin:/usr/pkg/bin:/usr/local/sbin:/usr/local/bin:$PATH
          export PATH
          case "$(uname -s)" in
            FreeBSD) xvfb=/usr/local/bin/Xvfb ;;
            OpenBSD) xvfb=/usr/X11R6/bin/Xvfb ;;
            NetBSD) xvfb=/usr/X11R7/bin/Xvfb ;;
          esac
          rm -rf smoke
          mkdir smoke
          "$xvfb" :99 -screen 0 1280x1024x24 -nolisten tcp >smoke/xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || :' EXIT
          n=0
          while [ ! -S /tmp/.X11-unix/X99 ]; do
            n=$((n + 1))
            if [ "$n" -gt 60 ] || ! kill -0 "$xvfb_pid" 2>/dev/null; then
              echo "Xvfb did not start"
              cat smoke/xvfb.log || :
              exit 1
            fi
            sleep 1
          done
          fail=0
          shot() {
            name=$1
            driver=$2
            shift 2
            if DISPLAY=:99 dbus-run-session -- \
                timeout 600 "$@" --video "$driver" \
                --shot "smoke/$name.bmp" --a11y-dump "smoke/$name.txt" \
                </dev/null >"smoke/$name.log" 2>&1; then
              if [ -s "smoke/$name.bmp" ] && [ -s "smoke/$name.txt" ]; then
                echo "$name: ok"
                return 0
              fi
              echo "$name: exited 0 without both a shot and a dump"
            else
              echo "$name: exit status $?"
            fi
            cat "smoke/$name.log" || :
            fail=1
          }
          shot simple x11 ./build/simple --theme light
          shot showcase x11 ./build/showcase --tab 7 --theme dark
          shot simple-dummy dummy ./build/simple --theme light
          exit "$fail"

      - name: Build mkicon
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          PATH=/usr/pkg/sbin:/usr/pkg/bin:/usr/local/sbin:/usr/local/bin:$PATH
          export PATH
          cmake --build build --target mkicon </dev/null

      - name: Package
        id: package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          PATH=/usr/pkg/sbin:/usr/pkg/bin:/usr/local/sbin:/usr/local/bin:$PATH
          export PATH
          version='${{ inputs.version || 'dev' }}'
          name="reaktor-${version#v}-${{ matrix.os }}-${{ matrix.arch }}"
          sh tools/package.sh build "dist/$name"
          mkdir -p check
          for from in "built build" "packed dist/$name"; do
            set -- $from
            dbus-run-session -- "$2/showcase" --tab 8 --theme light --video dummy \
              --shot "check/$1.bmp" --a11y-dump "check/$1.txt" </dev/null
          done
          for e in bmp txt; do
            cmp "check/built.$e" "check/packed.$e"
          done
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"

      - name: Check and pack libreaktor
        id: libcheck
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          PATH=/usr/pkg/sbin:/usr/pkg/bin:/usr/local/sbin:/usr/local/bin:$PATH
          export PATH
          version='${{ inputs.version || 'dev' }}'
          name="libreaktor-${version#v}-${{ matrix.os }}-${{ matrix.arch }}"
          cmake --build build --target libreaktor </dev/null
          cmake --install build --prefix "dist/$name" --component libreaktor </dev/null
          cmake -S examples/consumer -B build-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release \
                "-DCMAKE_PREFIX_PATH=$PWD/dist/$name" </dev/null
          cmake --build build-consumer </dev/null
          mkdir -p check
          for from in "lib-built build/simple" "lib-linked build-consumer/simple"; do
            set -- $from
            dbus-run-session -- "$2" --theme light --video dummy \
              --shot "check/$1.bmp" --a11y-dump "check/$1.txt" </dev/null
          done
          for e in bmp txt; do
            cmp "check/lib-built.$e" "check/lib-linked.$e"
          done
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name" build-consumer

      - name: Check the libreaktor system package
        if: ${{ !cancelled() && steps.libcheck.outcome == 'success' }}
        run: |
          PATH=/usr/pkg/sbin:/usr/pkg/bin:/usr/local/sbin:/usr/local/bin:$PATH
          export PATH
          sh tools/libreaktor-pkg.sh -i -o dist-pkg </dev/null
          cmake -S examples/consumer -B build-pkg-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH=/usr/local/reaktor </dev/null
          cmake --build build-pkg-consumer </dev/null
          dbus-run-session -- build-pkg-consumer/simple --theme light --video dummy \
            --shot check/lib-packaged.bmp --a11y-dump check/lib-packaged.txt </dev/null
          for e in bmp txt; do cmp "check/lib-built.$e" "check/lib-packaged.$e"; done

      - name: Collect the shots
        if: ${{ always() && steps.vm.outcome == 'success' }}
        shell: cpa.sh {0} --sync-files vm-to-runner
        run: |
          mkdir -p smoke
          for f in build/CMakeCache.txt build/CMakeFiles/CMakeConfigureLog.yaml; do
            if [ -f "$f" ]; then cp "$f" smoke/; fi
          done

      - name: Upload the package
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/reaktor-*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload libreaktor
        if: ${{ !cancelled() && steps.libcheck.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-libreaktor-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/libreaktor-*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload the shots
        if: ${{ always() && steps.vm.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bsd-${{ matrix.os }}-${{ matrix.version }}-${{ matrix.arch }}
          path: smoke/
          if-no-files-found: warn
          retention-days: 14

  # The arm64 programs built above, run on an arm64 machine: the tests, the
  # shots, the package, and a program linked against libreaktor with the
  # machine's own compiler. Nothing is compiled from the tree here.
  bsd-arm64:
    name: ${{ matrix.os }} ${{ matrix.version }} arm64
    needs: bsd
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: ${{ !inputs.strict }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: freebsd, version: '15.1' }
          - { os: openbsd, version: '7.9' }
          - { os: netbsd, version: '11.0' }
    defaults:
      run:
        shell: cpa.sh {0} --sync-files none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Download the arm64 build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cross-${{ matrix.os }}-arm64

      # Unpacked on the runner, before the machine reads the tree.
      - name: Unpack the arm64 build
        shell: bash
        run: |
          tar -xf cross-${{ matrix.os }}-arm64.tar
          rm cross-${{ matrix.os }}-arm64.tar
          chmod +x build-arm64/*
          ls -l build-arm64 dist

      - name: Start VM
        id: vm
        uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 # v1.6.0
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}
          architecture: arm64
          shell: sh
          cpu_count: 4
          memory: 8G
          sync_files: runner-to-vm

      - name: Install packages
        run: |
          PATH=/usr/pkg/sbin:/usr/pkg/bin:/usr/local/sbin:/usr/local/bin:$PATH
          export PATH
          case "$(uname -s)" in
            FreeBSD)
              sudo env IGNORE_OSVERSION=yes pkg install -y \
                cmake-core ninja pkgconf dbus xorg-vfbserver \
                libX11 libXext libXcursor libXi libXfixes libXrandr libXrender libXtst \
                libxkbcommon wayland libglvnd </dev/null
              ;;
            NetBSD)
              sudo -E pkgin -y update </dev/null
              sudo -E pkgin -y install cmake ninja-build pkgconf dbus libxkbcommon wayland </dev/null
              ;;
            OpenBSD)
              sudo pkg_add -I cmake-core ninja dbus libxkbcommon wayland </dev/null
              ;;
          esac
          uname -a
          file build-arm64/showcase

      - name: Console tests
        id: tests
        run: |
          fail=0
          for t in onlaytest keytest a11ytest animtest localetest laytest texttest csstest; do
            echo "== $t"
            if ./build-arm64/$t </dev/null; then :; else echo "$t: exit status $?"; fail=1; fi
          done
          exit "$fail"

      - name: Shots and dumps
        if: ${{ !cancelled() && steps.vm.outcome == 'success' }}
        run: |
          PATH=/usr/pkg/sbin:/usr/pkg/bin:/usr/local/sbin:/usr/local/bin:$PATH
          export PATH
          case "$(uname -s)" in
            FreeBSD) xvfb=/usr/local/bin/Xvfb ;;
            OpenBSD) xvfb=/usr/X11R6/bin/Xvfb ;;
            NetBSD) xvfb=/usr/X11R7/bin/Xvfb ;;
          esac
          rm -rf smoke
          mkdir smoke
          "$xvfb" :99 -screen 0 1280x1024x24 -nolisten tcp >smoke/xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || :' EXIT
          n=0
          while [ ! -S /tmp/.X11-unix/X99 ]; do
            n=$((n + 1))
            if [ "$n" -gt 60 ] || ! kill -0 "$xvfb_pid" 2>/dev/null; then
              echo "Xvfb did not start"
              cat smoke/xvfb.log || :
              exit 1
            fi
            sleep 1
          done
          fail=0
          shot() {
            name=$1
            driver=$2
            shift 2
            if DISPLAY=:99 dbus-run-session -- \
                timeout 600 "$@" --video "$driver" \
                --shot "smoke/$name.bmp" --a11y-dump "smoke/$name.txt" \
                </dev/null >"smoke/$name.log" 2>&1; then
              if [ -s "smoke/$name.bmp" ] && [ -s "smoke/$name.txt" ]; then
                echo "$name: ok"
                return 0
              fi
              echo "$name: exited 0 without both a shot and a dump"
            else
              echo "$name: exit status $?"
            fi
            cat "smoke/$name.log" || :
            fail=1
          }
          shot simple x11 ./build-arm64/simple --theme light
          shot showcase x11 ./build-arm64/showcase --tab 7 --theme dark
          shot simple-dummy dummy ./build-arm64/simple --theme light
          exit "$fail"

      - name: Package
        id: package
        if: ${{ !cancelled() && steps.vm.outcome == 'success' }}
        run: |
          PATH=/usr/pkg/sbin:/usr/pkg/bin:/usr/local/sbin:/usr/local/bin:$PATH
          export PATH
          version='${{ inputs.version || 'dev' }}'
          name="reaktor-${version#v}-${{ matrix.os }}-arm64"
          sh tools/package.sh build-arm64 "dist/$name"
          mkdir -p check
          for from in "built build-arm64" "packed dist/$name"; do
            set -- $from
            dbus-run-session -- "$2/showcase" --tab 8 --theme light --video dummy \
              --shot "check/$1.bmp" --a11y-dump "check/$1.txt" </dev/null
          done
          for e in bmp txt; do
            cmp "check/built.$e" "check/packed.$e"
          done
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"

      - name: Check and pack libreaktor
        id: libcheck
        if: ${{ !cancelled() && steps.vm.outcome == 'success' }}
        run: |
          PATH=/usr/pkg/sbin:/usr/pkg/bin:/usr/local/sbin:/usr/local/bin:$PATH
          export PATH
          version='${{ inputs.version || 'dev' }}'
          name="libreaktor-${version#v}-${{ matrix.os }}-arm64"
          cmake -S examples/consumer -B build-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release \
                "-DCMAKE_PREFIX_PATH=$PWD/dist/$name" </dev/null
          cmake --build build-consumer </dev/null
          mkdir -p check
          for from in "lib-built build-arm64/simple" "lib-linked build-consumer/simple"; do
            set -- $from
            dbus-run-session -- "$2" --theme light --video dummy \
              --shot "check/$1.bmp" --a11y-dump "check/$1.txt" </dev/null
          done
          for e in bmp txt; do
            cmp "check/lib-built.$e" "check/lib-linked.$e"
          done
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name" build-consumer

      - name: Collect the shots
        if: ${{ always() && steps.vm.outcome == 'success' }}
        shell: cpa.sh {0} --sync-files vm-to-runner
        run: |
          mkdir -p smoke
          if [ -f build-arm64/CMakeCache.txt ]; then cp build-arm64/CMakeCache.txt smoke/; fi

      - name: Upload the package
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.os }}-arm64
          path: dist/reaktor-*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload libreaktor
        if: ${{ !cancelled() && steps.libcheck.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-libreaktor-${{ matrix.os }}-arm64
          path: dist/libreaktor-*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload the shots
        if: ${{ always() && steps.vm.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bsd-${{ matrix.os }}-${{ matrix.version }}-arm64
          path: smoke/
          if-no-files-found: warn
          retention-days: 14

