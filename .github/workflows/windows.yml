name: Windows

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    env:
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 500M
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-2025, out: build }
          - { arch: x86, runner: windows-2025, out: build-x86 }
          - { arch: arm64, runner: windows-11-arm, out: build }
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # ccache's own release, pinned and checked; without it the build only runs uncached.
      - name: Install ccache
        id: ccache-tool
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $v = '4.14.1'
          if ($env:RUNNER_ARCH -eq 'ARM64') {
            $a = 'aarch64'; $sum = '28121851c8c2c8b76214cfc5e119d769fbc39e93d27862e4e3a556905ebd23b2'
          } else {
            $a = 'x86_64'; $sum = '6219f3865ca59aec41ee4b678df171d5d35855ecb2b6dbbbd20690b3a68af7b4'
          }
          $zip = Join-Path $env:RUNNER_TEMP "ccache.zip"
          try {
            Invoke-WebRequest -Uri "https://github.com/ccache/ccache/releases/download/v$v/ccache-$v-windows-$a.zip" `
              -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 5
            if ((Get-FileHash -Algorithm SHA256 $zip).Hash -ne $sum) { throw "ccache-$v-windows-$a.zip: checksum mismatch" }
            Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
            $dir = Join-Path $env:RUNNER_TEMP "ccache-$v-windows-$a"
            & "$dir/ccache.exe" --version | Select-Object -First 1
            Add-Content $env:GITHUB_PATH $dir
            "use=true" >> $env:GITHUB_OUTPUT
          } catch {
            Write-Host "::warning::ccache unavailable, building without it: $_"
            "use=false" >> $env:GITHUB_OUTPUT
          }

      # ccache only: the build folder is rebuilt, so a stale cache cannot hide a broken one.
      - name: Restore the compiler cache
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-windows-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: ccache-windows-${{ matrix.arch }}-

      # Release objects carry no debug info, which is what lets ccache take MSVC's.
      - name: Build
        id: build
        run: |
          $launch = @()
          if ('${{ steps.ccache-tool.outputs.use }}' -eq 'true') {
            ccache -z
            $launch = '-DCMAKE_C_COMPILER_LAUNCHER=ccache', '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache', '-DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON'
          }
          ./build.ps1 -Arch ${{ matrix.arch }} '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded' @launch
          if ('${{ steps.ccache-tool.outputs.use }}' -eq 'true') { ccache -s }

      - name: Console tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          $fail = 0
          foreach ($t in 'onlaytest', 'keytest', 'a11ytest', 'animtest', 'localetest', 'laytest', 'texttest', 'csstest') {
            Write-Host "== $t"
            & "./${{ matrix.out }}/$t.exe"
            if ($LASTEXITCODE -ne 0) { Write-Host "${t}: exit status $LASTEXITCODE"; $fail = 1 }
          }
          exit $fail

      - name: Shots and dumps
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          $script:fail = 0
          function Shot([string]$name, [string]$driver, [string]$exe, [string[]]$more) {
            $argv = @($more) + @('--video', $driver, '--shot', "smoke/$name.bmp",
                                 '--a11y-dump', "smoke/$name.txt")
            $p = Start-Process -FilePath $exe -ArgumentList $argv -PassThru `
                   -RedirectStandardOutput "smoke/$name.log" -RedirectStandardError "smoke/$name.err"
            $null = $p.Handle
            if (-not $p.WaitForExit(600000)) {
              $p.Kill()
              Write-Host "${name}: timed out"
            } elseif ($p.ExitCode -ne 0) {
              Write-Host "${name}: exit status $($p.ExitCode)"
            } elseif ((Test-Path "smoke/$name.bmp") -and (Get-Item "smoke/$name.bmp").Length -gt 0 -and
                      (Test-Path "smoke/$name.txt") -and (Get-Item "smoke/$name.txt").Length -gt 0) {
              Write-Host "${name}: ok"
              return
            } else {
              Write-Host "${name}: exited 0 without both a shot and a dump"
            }
            Get-Content "smoke/$name.log", "smoke/$name.err" -ErrorAction SilentlyContinue
            $script:fail = 1
          }
          Shot simple windows "./${{ matrix.out }}/simple.exe" @('--theme', 'light')
          Shot showcase windows "./${{ matrix.out }}/showcase.exe" @('--tab', '7', '--theme', 'dark')
          Shot simple-dummy dummy "./${{ matrix.out }}/simple.exe" @('--theme', 'light')
          exit $script:fail

      - name: One copy at a time
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          $exe = "./${{ matrix.out }}/showcase.exe"
          $first = Start-Process $exe -ArgumentList '--video', 'dummy', '--log', 'smoke/instance.log' -PassThru
          Start-Sleep -Seconds 5
          $second = Start-Process $exe -ArgumentList '--video', 'dummy', 'handed-over.txt' -PassThru
          if (-not $second.WaitForExit(60000)) { $second.Kill(); throw "the second launch did not exit" }
          if ($second.ExitCode -ne 0) { throw "the second launch exited with $($second.ExitCode)" }
          Start-Sleep -Seconds 2
          if ($first.HasExited) { throw "the running copy is gone" }
          # The log is held open until the copy ends.
          $first.Kill(); $first.WaitForExit()
          if (-not (Select-String -Path smoke/instance.log -Pattern 'handed-over.txt' -Quiet)) {
            Get-Content smoke/instance.log; throw "the running copy did not get the file"
          }
          Write-Host "second launch handed its file over: ok"

      - name: Scripted UI test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          $p = Start-Process "./${{ matrix.out }}/uitest.exe" -ArgumentList '--log', 'smoke/uitest.log' -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "uitest did not finish" }
          Select-String -Path smoke/uitest.log -Pattern 'test:' | ForEach-Object { $_.Line }
          if ($p.ExitCode -ne 0) { throw "uitest exited with $($p.ExitCode)" }

      - name: Package
        id: package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          version='${{ inputs.version || 'dev' }}'
          name="reaktor-${version}-windows-${{ matrix.arch }}"
          sh tools/package.sh "${{ matrix.out }}" "dist/$name" .exe
          echo "name=$name" >>"$GITHUB_OUTPUT"

      - name: Check and zip the package
        id: check
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          $dir = "dist/${{ steps.package.outputs.name }}"
          New-Item -ItemType Directory -Force check | Out-Null
          foreach ($from in @(@('built', "${{ matrix.out }}"), @('packed', $dir))) {
            $p = Start-Process -FilePath "$($from[1])/showcase.exe" -PassThru -ArgumentList @(
                   '--tab', '8', '--theme', 'light', '--video', 'dummy',
                   '--shot', "check/$($from[0]).bmp", '--a11y-dump', "check/$($from[0]).txt")
            $null = $p.Handle
            if (-not $p.WaitForExit(600000)) { $p.Kill(); throw "$($from[0]): timed out" }
            if ($p.ExitCode -ne 0) { throw "$($from[0]): exit status $($p.ExitCode)" }
          }
          foreach ($e in 'bmp', 'txt') {
            if ((Get-FileHash "check/built.$e").Hash -ne (Get-FileHash "check/packed.$e").Hash) {
              throw "the packaged showcase draws its Translations page differently ($e)"
            }
          }
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"

      - name: Upload the package
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-windows-${{ matrix.arch }}
          path: dist/reaktor-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Build libreaktor
        id: lib
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          $launch = @()
          if ('${{ steps.ccache-tool.outputs.use }}' -eq 'true') {
            $launch = '-DCMAKE_C_COMPILER_LAUNCHER=ccache', '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache', '-DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON'
          }
          ./build.ps1 -Arch ${{ matrix.arch }} -Out build-lib libreaktor @launch

      - name: Save the compiler cache
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Check and zip libreaktor
        id: libcheck
        if: ${{ !cancelled() && steps.lib.outcome == 'success' }}
        run: |
          $version = '${{ inputs.version || 'dev' }}'
          $name = "libreaktor-$version-windows-${{ matrix.arch }}"
          cmake --install build-lib --prefix "dist/$name" --component libreaktor
          if ($LASTEXITCODE -ne 0) { throw "install failed" }
          ./build.ps1 -Arch ${{ matrix.arch }} -Source examples/consumer -Out build-consumer `
                      "-DCMAKE_PREFIX_PATH=$PWD/dist/$name"
          New-Item -ItemType Directory -Force check | Out-Null
          foreach ($from in @(@('lib-built', "${{ matrix.out }}/simple.exe"),
                              @('lib-linked', 'build-consumer/simple.exe'))) {
            $p = Start-Process -FilePath $from[1] -PassThru -ArgumentList @(
                   '--theme', 'light', '--video', 'dummy',
                   '--shot', "check/$($from[0]).bmp", '--a11y-dump', "check/$($from[0]).txt")
            $null = $p.Handle
            if (-not $p.WaitForExit(600000)) { $p.Kill(); throw "$($from[0]): timed out" }
            if ($p.ExitCode -ne 0) { throw "$($from[0]): exit status $($p.ExitCode)" }
          }
          foreach ($e in 'bmp', 'txt') {
            if ((Get-FileHash "check/lib-built.$e").Hash -ne (Get-FileHash "check/lib-linked.$e").Hash) {
              throw "simple linked against libreaktor draws differently ($e)"
            }
          }
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"

      - name: Upload libreaktor
        if: ${{ !cancelled() && steps.libcheck.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-libreaktor-windows-${{ matrix.arch }}
          path: dist/libreaktor-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload the shots
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}
          path: smoke/
          if-no-files-found: warn
          retention-days: 14
