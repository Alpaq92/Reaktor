<!doctype html>
<!-- emcc --shell-file: the page the wasm build is wrapped in. -->

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reaktor</title>
<link rel="icon" type="image/svg+xml" href="reaktor-icon.svg">
<link rel="alternate icon" type="image/png" href="reaktor-icon.png">
<style>
  html, body {
    margin: 0;
    height: 100%;

    background: #f7f7f7;
    overflow: hidden;
  }
  @media (prefers-color-scheme: dark) {
    html, body { background: #252525; }
  }

  #canvas {
    display: block;
    outline: none;

    border-radius: 10px 10px 0 0;

    transform: translate3d(0, 0, 0);
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    image-rendering: -webkit-optimize-contrast;
  }
  #status {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    color: #c0c0c0;
    font: 14px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, sans-serif;

    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="status">loading&hellip;</div>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()">
  </canvas>
  <script>
    var statusEl = document.getElementById('status');
    var Module = {
      canvas: document.getElementById('canvas'),
      print: function (text) { console.log(text); },
      printErr: function (text) { console.error(text); },
      setStatus: function (text) {
        if (!statusEl) return;
        if (text) { statusEl.textContent = text; return; }
        statusEl.remove();
        statusEl = null;
      }
    };

    Module.canvas.addEventListener('mousedown', function () {
      Module.canvas.focus();
    });

    Module.canvas.addEventListener('keydown', function (e) {
      if (e.key === 'Tab') e.preventDefault();
    });

    Module.onRuntimeInitialized = function () { Module.setStatus(''); };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
