     501 custom properties, calc() and pseudo-elements survive the pipeline,
     not building a page. -->
<html>
<body>
  <main class="container">
    <h1>Curie</h1>
    <p>Rendered by <b>litehtml</b>, painted through <b>Nuklear</b> on

    <button>Primary</button>
    <button class="secondary">Secondary</button>
    <p><a href="#">A link</a> and some <code>inline code</code>.</p>
    <blockquote>Layout, cascade and custom properties all come from
      upstream files read at runtime.</blockquote>
  </main>
</body>
</html>
